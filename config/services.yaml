#---
# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/services
#

- Network:
  - Wired Network:
      widget:
        type: glances
        url: http://edi.home:61208
        username: glances
        password: {{HOMEPAGE_VAR_GLANCES_PASSWORD}}
        metric: network:enp9s0
        chart: true
  - Bridged Network:
      widget:
        type: glances
        url: http://edi.home:61208
        username: edi
        password: {{HOMEPAGE_VAR_GLANCES_PASSWORD}}
        metric: network:br0
        chart: true
  - Docker Network:
      widget:
        type: glances
        url: http://edi.home:61208
        username: edi
        password: {{HOMEPAGE_VAR_GLANCES_PASSWORD}}
        metric: network:docker0
        chart: true


- Virtualisation:
  - Portainer:
      href: http://edi.home:9000
      description: Docker web-ui
      server: my-docker
      container: portainer
      icon: /icons/portainer.png
      widget:
        type: portainer
        url: http://edi.home:9000
        fields: ["running", "stopped", "total"]
        env: 2
        key: {{HOMEPAGE_VAR_PORTAINER_APIKEY}}

  - Sons Of The Forest:
      icon: /icons/sotf.png
      widget:
        type: gamedig
          #serverType: sonsoftheforest #in older versions
        serverType: sotf #in newest versions
        fields: ["status", "currentPlayers", "maxPlayers", "ping"]
        url: udp://edi.home:8766

  - Enshrouded:
      icon: /icons/corekeeper.png
      widget:
        type: gamedig
        serverType: enshrouded
        fields: ["status", "currentPlayers", "maxPlayers", "ping"]
        url: udp://edi.home:15637

- Downloads:
  - Flood over Transmission:
      href: http://edi.home:3000/
      description: Torrent client webui
      icon: /icons/transmission.png
      widget:
        type: transmission
        url: http://edi.home:9091
        username: transmission
        password: {{HOMEPAGE_VAR_TRANSMISSION_PASSWORD}}
        fields: ["leech", "download", "seed", "upload"]
        rpcUrl: /transmission/

  - MySpeed:
      href: http://edi.home:5216
      server: my-docker
      container: myspeed
      icon: /icons/myspeed.png
      widget:
        type: myspeed
        fields: ["ping", "download", "upload"]
        url: http://edi.home:5216

  - Scrutiny:
      href: http://edi.home:8080
      icon: /icons/scrutiny.png
      widget:
        type: scrutiny
        url: http://edi.home:8080

- Misc:
  - Home Assistant:
     description: Still in develop
     href: http://edi.home:8123/
     server: my-docker
     container: homeassistant
     icon: /icons/homeassistant.png
     widget:
       type: homeassistant
       url: http://edi.home:8123
       key: {{HOMEPAGE_VAR_HASS_APIKEY}}

  - Adguard:
     href: http://edi.home:3001/
     ping: http://edi.home:3001/
     server: my-docker
     container: adguard
     icon: /icons/adguard.png
     widget:
       type: adguard
       url: http://edi.home:3001/
       username: edi
       password: {{HOMEPAGE_VAR_ADGUARD_PASSWORD}}

  - Mikrotik:
      description: uhm... mikrotik?
      href: http://192.168.1.1
      icon: /icons/mikrotik.png
      widget:
        type: mikrotik
        url: http://192.168.1.1
        username: edi 
        password: {{HOMEPAGE_VAR_ADGUARD_PASSWORD}}
    
